name: Live programs

# Starts every supported download program in a container, puts it into every status it can reach and records the
# answers the drivers read. The recordings (artifact `fixtures-<program>-<tag>`) are the drivers' test fixtures
# under test/fixtures/ — nothing here gates a release, it measures the real programs.
on:
  workflow_dispatch:
    inputs:
      program:
        description: "Record only this program (empty: every program)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "src/lib/programs/**"
      - "test/live/**"
      - ".github/workflows/live-programs.yml"

permissions:
  contents: read

concurrency:
  group: live-programs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-programs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - program: qbittorrent
            tag: 4.6.7-1
          - program: qbittorrent
            tag: 5.1.4-2
          - program: qbittorrent
            tag: 5.2.3-1
          - program: transmission
            tag: 4.0.6-r6-ls326
          - program: transmission
            tag: 4.1.3-r0-ls362
          - program: deluge
            tag: 2.1.1-r10-ls324
          - program: deluge
            tag: 2.2.0-ls383
          - program: sabnzbd
            tag: 4.5.5-ls250
          - program: sabnzbd
            tag: 5.1.3-ls274
          - program: nzbget
            tag: v24.8
          - program: nzbget
            tag: v26.3
          - program: aria2
            tag: "3.22"
          - program: pyload
            tag: 0.5.0b3.dev101-ls255
          - program: jdownloader
            tag: v26.09.1
          - program: rqbit
            tag: 8.1.1
          - program: rqbit
            tag: 9.1.0
          - program: rtorrent
            tag: 4.3.1-0.9.8_3-0.13.8_2
          - program: rtorrent
            tag: 5.3.18-0.16.25
          # the image installs the stable .deb of its build day: this tag carries 8.0.7 (Sonarr's tested version)
          - program: tribler
            tag: v8.0.7-75-g12eb5bab6
          - program: tribler
            tag: v8.4.2
          # 4.11.0 (the last express release) does not speak rTorrent 0.16: settings 500 "method not found: false=",
          # add 500 "method not found: load.start_throw" (run 43677990506) — recorded in front of Transmission
          - program: flood
            tag: 4.11.0-transmission
          - program: flood
            tag: 4.16.4-rtorrent
          - program: flood
            tag: 4.16.4-qbittorrent
          - program: flood
            tag: 4.16.4-transmission
          - program: flood
            tag: 4.16.4-deluge
          # Vuze 5.7.6.0 (the last release) with its Web Remote plugin, fetched and checked by the module
          - program: vuze
            tag: 5.7.6.0-xmwebui-0.6.5
          # µTorrent Server for Linux (utserver alpha 3.3) in ekho/utorrent, pinned by digest in the module
          - program: utorrent
            tag: "2021-04-22"
          # Hadouken 5.2.0 (libtorrent 1.0.5) built from its tag in mediadepot/hadouken, pinned by digest in the module
          - program: hadouken
            tag: 5.2.0
    # a manual start may name one program; the other matrix entries then skip every step
    env:
      SELECTED: ${{ inputs.program == '' || inputs.program == matrix.program }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-node@v7
        if: env.SELECTED == 'true'
        with:
          node-version: 22.x
      - name: Record ${{ matrix.program }} ${{ matrix.tag }}
        if: env.SELECTED == 'true'
        run: node test/live/record.mjs "${{ matrix.program }}" "${{ matrix.tag }}"
      - name: Upload the recordings
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fixtures-${{ matrix.program }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/fixtures-out/
          if-no-files-found: warn
