name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-**
    # A documentation-only push starts no run. The repository standard checks DO read these files
    # (README changelog, docs/, .gitignore) — the local pre-push guard runs them for such a push.
    # GitHub's docs state "Path filters are not evaluated for pushes of tags", so the
    # release run on a tag is unaffected. Deliberately only under `push`, never under
    # `pull_request` — there this run is the required check of the branch protection
    # (which is what lets Dependabot merges through).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE"
      # No job reads the Dependabot configuration; the pre-push guard rightly refuses a
      # skip-CI marker for it, so the filter is the only thing that keeps a config
      # change from running the full matrix (seven such runs on 2026-09-15).
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          # Set by the consistency audit (floor: the repochecker's
          # minimumNodeVersionCheckAndLint, or engines.node) — never edit by hand.
          node-version: "24.x"
          type-checking: true
          lint: true

  repochecker-version-gate:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify io-package.json against ioBroker stable repository
        run: |
          set -euo pipefail
          # Source: sources-dist-stable.json — the official stable channel from
          # ioBroker.repositories. Default installations (`activeRepo: stable`)
          # pull every ioBroker adapter from there. Every adapter requirement
          # declared in io-package.json (common.dependencies +
          # common.globalDependencies) must be AT LEAST latest-stable.
          # Behind = drift (block). Ahead = allowed: the dependency check at
          # install time blocks the update on systems that do not meet the
          # requirement, and stable users only ever get the adapter version
          # pinned in sources-dist-stable.json anyway (tt-tom17 pattern:
          # ioBroker.public-transport 1.x on npm-latest with globalDependencies
          # an admin floor of a new major before that major reached stable).
          URL="https://raw.githubusercontent.com/ioBroker/ioBroker.repositories/master/sources-dist-stable.json"
          # Round 110 (audit E-M2): an unreachable source was "skipping live check" and green —
          # a gate that cannot measure is red. Three tries with a pause ride out a short outage.
          HTTP_STATUS=$(curl -sLo /tmp/stable.json -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors "$URL" || echo "000")
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "::error ::sources-dist-stable.json returned 404 — file moved/renamed. Update workflow URL."
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error ::sources-dist-stable.json not readable (HTTP $HTTP_STATUS after three tries) — the requirements are unchecked; re-run the job"
            exit 1
          fi
          # Schema sanity: without js-controller + admin the file is broken
          JS_STABLE=$(jq -r '."js-controller".version // ""' /tmp/stable.json)
          ADMIN_STABLE=$(jq -r '.admin.version // ""' /tmp/stable.json)
          if [ -z "${JS_STABLE}" ] || [ -z "${ADMIN_STABLE}" ]; then
            echo "::error ::sources-dist-stable.json schema changed — could not parse js-controller/admin versions."
            exit 1
          fi
          # Iterate over every adapter dependency in io-package.json (dependencies + globalDependencies)
          # and compare each one against its stable value. Format: "<kind>\t<name>\t<value>"
          DEPS=$(jq -r '
            [
              (.common.dependencies // [] | map(to_entries[] | "dependencies\t\(.key)\t\(.value)")),
              (.common.globalDependencies // [] | map(to_entries[] | "globalDependencies\t\(.key)\t\(.value)"))
            ] | flatten | .[]
          ' io-package.json)
          FAIL=0
          while IFS=$'\t' read -r KIND NAME VALUE; do
            [ -z "${NAME}" ] && continue
            STABLE=$(jq -r --arg n "${NAME}" '.[$n].version // ""' /tmp/stable.json)
            if [ -z "${STABLE}" ]; then
              echo "::warning ::${NAME} not in sources-dist-stable.json — skipping (no autosync target)"
              continue
            fi
            case "${VALUE}" in
              ">="*) MIN="${VALUE#>=}" ;;
              *)
                echo "::error ::Unexpected format: io-package.json ${KIND}.${NAME}=${VALUE} — fleet standard is \">=<version>\""
                FAIL=1
                continue ;;
            esac
            if [ "${MIN}" = "${STABLE}" ]; then
              echo "✓ ${KIND}.${NAME} = ${VALUE}"
            elif [ "$(printf '%s\n%s\n' "${MIN}" "${STABLE}" | sort -V | head -n1)" = "${STABLE}" ]; then
              echo "✓ ${KIND}.${NAME} = ${VALUE} (ahead of stable ${STABLE} — install-side dependency check protects older systems)"
            else
              echo "::error ::Drift: io-package.json ${KIND}.${NAME}=${VALUE} is behind stable, expected at least >=${STABLE}"
              FAIL=1
            fi
          done <<< "${DEPS}"
          if [ "${FAIL}" -eq 1 ]; then
            echo ""
            echo "Source: https://github.com/ioBroker/ioBroker.repositories/blob/master/sources-dist-stable.json"
            echo "Fix: bump io-package.json common.dependencies / globalDependencies to at least the stable versions above."
            exit 1
          fi
          echo "✓ all ioBroker-deps at or ahead of stable repository"

  workflow-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow YAML files (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  adapter-tests:
    # The tag push starts a COMPLETE second run: the matrix runs again there, and `deploy` depends
    # on the tests of its own run. That is the property the repochecker verifies — never make this
    # job or its step conditional on the ref.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # DERIVED, not copied: (required u recommended) n valid from the installed
        # repochecker, everything >= engines.node — apply_workflow_node_matrix_fix sets
        # this line in release mode. The value below is just today's result.
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Run tests
        uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  adapter-inventory:
    # The adapter's own start proof, on every push: it runs against its fixture server
    # (test/inventory.js) and, with a previous release tag, proves that an update reaches
    # every existing object (upgrade suite). Locally the same run is release gate D06.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: the upgrade suite seeds the previous release's inventory
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Export the previous release's inventory for the upgrade suite
        run: |
          set -euo pipefail
          # From HEAD^: the release commit carries its own new tag on the tag run AND on the main push
          # of the same commit — excluding only the ref name compared the tree with itself on main.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -n "$tag" ] && git show "$tag:test/objects.inventory.json" > /tmp/inventory-previous.json 2>/dev/null; then
            echo "INVENTORY_PREVIOUS=/tmp/inventory-previous.json" >> "$GITHUB_ENV"
            echo "previous inventory: $tag"
          else
            echo "no previous release — upgrade suite not applicable"
          fi
      - name: Start the adapter against its fixture server
        run: |
          set -euo pipefail
          npm run test:inventory 2>&1 | tee /tmp/inventory.log
          if [ -n "${INVENTORY_PREVIOUS:-}" ] && ! grep -q "upgrade from the previous release" /tmp/inventory.log; then
            echo "::error ::the upgrade suite did not run although a previous inventory exists"
            exit 1
          fi
      - name: Fail when the committed inventory differs from what the code produces
        run: |
          # Round 110 (audit E-M1): `git diff` sees no file that was never committed — an untracked inventory passed.
          if ! git ls-files --error-unmatch test/objects.inventory.json > /dev/null 2>&1; then
            echo "::error ::test/objects.inventory.json is not committed — regenerate it (npm run test:inventory) and commit it with the code"
            exit 1
          fi
          if ! git diff --quiet -- test/objects.inventory.json; then
            git diff --stat -- test/objects.inventory.json
            echo "::error ::test/objects.inventory.json differs from what the adapter produces — regenerate it (npm run test:inventory) and commit it with the code"
            exit 1
          fi
      - name: Judge the values a user sees
        # Every value in its list, labels that say more than the raw value and follow the system
        # language, enum values with a list, no coded raw values — from the dumps the run above wrote.
        run: >-
          npx iobroker-adapter-checks values
          --objects test/objects.inventory.json
          --states test/states.inventory.json
          --objects-other-language test/objects.inventory.de.json
          --declarations test/readable-values.json

  ci-passed:
    # The one required check of the automerge ruleset: green only when every job that deploy waits for
    # is green (every matrix leg, every gate job); a job skipped because of a red dependency fails it.
    if: ${{ !cancelled() }}
    needs:
      - check-and-lint
      - adapter-tests
      - repochecker-version-gate
      - workflow-lint
      - adapter-inventory
      - release-tag-guard
    runs-on: ubuntu-latest
    steps:
      - name: Every job deploy waits for passed
        run: echo '${{ toJSON(needs.*.result) }}' | jq -e 'all(. == "success")'

  release-tag-guard:
    # Runs on every event and passes on anything but a release tag: ci-passed counts a skipped job as failed, so a
    # job-level tag condition would turn every pull request red.
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A release tag sits on the default branch and names the manifest version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The deploy job publishes whatever package.json says, for whatever commit the tag points to
          # (ioBroker/testing-action-deploy compares neither). The release script pushes the branch first and the
          # tag second, so a real release tag is always on the default branch by the time this runs. What this job
          # cannot see: whether the local release run (the stamp) happened — that stays the pre-push guard's job.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "not a release tag ($GITHUB_REF) — nothing to check"
              exit 0
              ;;
          esac
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(jq -r '.version // ""' package.json)"
          FAIL=0
          if [ "$TAG" != "$PKG" ]; then
            echo "::error ::Tag $TAG does not match package.json version $PKG — npm would publish $PKG"
            FAIL=1
          fi
          # Every adapter carries io-package.json; a plain npm package (the check package itself) does not.
          if [ -f io-package.json ]; then
            IOPKG="v$(jq -r '.common.version // ""' io-package.json)"
            if [ "$TAG" != "$IOPKG" ]; then
              echo "::error ::Tag $TAG does not match io-package.json common.version $IOPKG"
              FAIL=1
            fi
          fi
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error ::Tag $TAG points to $GITHUB_SHA, which is not on ${DEFAULT_BRANCH} — a release is cut from the default branch only"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ $TAG is on ${DEFAULT_BRANCH} and matches the manifest version"

  deploy:
    needs:
      - check-and-lint
      - adapter-tests
      - repochecker-version-gate
      - workflow-lint
      - adapter-inventory
      - release-tag-guard
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          # Always the highest EVEN major of the test matrix, floored at
          # max(minimumNodeVersionDeploy, engines.node) — the consistency audit aligns
          # this line in release mode; never edit it by hand. Odd majors never become
          # LTS (nodejs/Release/schedule.json), and the publish step is exactly where two
          # npm regressions hit (promise-retry on 22, sigstore on 24) with no gate to
          # catch them: the repochecker reports nothing above its deploy floor.
          node-version: "26.x"
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sentry: true
          sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-url: https://de.sentry.io
          sentry-org: power-dreams
          sentry-project: iobroker
          sentry-version-prefix: iobroker.dl-manager
          sentry-sourcemap-paths: build/
