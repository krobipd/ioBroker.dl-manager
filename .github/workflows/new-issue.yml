name: New issue

# A friendly first reply on every new issue that names an older adapter version: the reported
# version is compared with the npm release, and only when it is older the issue gets the label
# `not-latest-version` and one short bilingual note. No threats, no task list, no auto-close —
# the reporter has already done what the form asked.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  version-hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body || "";
            // Only a plain version is read, and only that is ever written back: free text from the form would land in
            // the comment as Markdown (links, @mentions).
            const VERSION = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/;
            const m = body.match(/### Adapter-Version[^\n]*\n+\s*v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)(?=\s|$)/);
            if (!m) return; // no readable version — nothing to compare
            const reported = m[1];
            const name = context.payload.repository.name.toLowerCase();
            const res = await fetch(`https://registry.npmjs.org/${name}/latest`);
            if (!res.ok) return; // the registry is not the issue's problem
            const latest = String((await res.json()).version || "");
            if (!VERSION.test(latest)) return;
            // Only an OLDER version gets the hint — a newer one (a beta from npm `next`) is not outdated. A pre-release
            // of the current version is older than it; two pre-releases of one version are left alone.
            const older = (a, b) => {
              const x = VERSION.exec(a), y = VERSION.exec(b);
              for (let i = 1; i <= 3; i++) {
                if (Number(x[i]) !== Number(y[i])) return Number(x[i]) < Number(y[i]);
              }
              return x[4] !== undefined && y[4] === undefined;
            };
            if (!older(reported, latest)) return;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const label = "not-latest-version";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "fbca04",
                description: "Reported on an adapter version that is not the current release" });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            await github.rest.issues.createComment({ owner, repo, issue_number, body:
              `Danke für die Meldung! Du hast Version **${reported}** angegeben, aktuell ist **${latest}**. ` +
              `Vielleicht ist das Thema dort schon behoben — ein Update ist schnell gemacht, und falls es danach weiterhin auftritt, bleibt dieses Issue offen.\n\n` +
              `Thanks for the report! You mentioned version **${reported}**; the current release is **${latest}**. ` +
              `The issue may already be fixed there — updating is quick, and if it still occurs afterwards this issue stays open.` });
